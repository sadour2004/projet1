<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an inbox automatically labeling emails">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1280" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-20" y="-20" width="1240" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="210" cy="170" r="120" fill="#A5B4FC" opacity="0.25"/>
  <circle cx="1020" cy="140" r="150" fill="#7DD3FC" opacity="0.22"/>
  <circle cx="1020" cy="680" r="170" fill="#C4B5FD" opacity="0.18"/>

  <!-- Main card -->
  <g filter="url(#shadow)">
    <rect x="210" y="150" width="780" height="500" rx="28" fill="url(#card)"/>
    <rect x="210" y="150" width="780" height="70" rx="28" fill="#0F172A" opacity="0.04"/>

    <!-- Top bar controls -->
    <circle cx="250" cy="185" r="7" fill="#FB7185"/>
    <circle cx="275" cy="185" r="7" fill="#FBBF24"/>
    <circle cx="300" cy="185" r="7" fill="#34D399"/>

    <!-- Inbox title -->
    <text x="330" y="192" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" fill="#0F172A" opacity="0.85">
      Inbox  Auto labeled
    </text>

    <!-- Left message list -->
    <g>
      <rect x="250" y="250" width="360" height="72" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
      <rect x="270" y="270" width="190" height="12" rx="6" fill="#0F172A" opacity="0.80"/>
      <rect x="270" y="292" width="250" height="10" rx="5" fill="#0F172A" opacity="0.25"/>
      <rect x="540" y="268" width="56" height="20" rx="10" fill="#FCE7F3"/>
      <text x="552" y="283" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#9D174D">Sponsorship</text>
    </g>

    <g>
      <rect x="250" y="342" width="360" height="72" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
      <rect x="270" y="362" width="210" height="12" rx="6" fill="#0F172A" opacity="0.80"/>
      <rect x="270" y="384" width="260" height="10" rx="5" fill="#0F172A" opacity="0.25"/>
      <rect x="534" y="360" width="62" height="20" rx="10" fill="#E0F2FE"/>
      <text x="546" y="375" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#075985">Collab</text>
    </g>

    <g>
      <rect x="250" y="434" width="360" height="72" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
      <rect x="270" y="454" width="240" height="12" rx="6" fill="#0F172A" opacity="0.80"/>
      <rect x="270" y="476" width="250" height="10" rx="5" fill="#0F172A" opacity="0.25"/>
      <rect x="506" y="452" width="90" height="20" rx="10" fill="#ECFCCB"/>
      <text x="518" y="467" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#3F6212">Business</text>
    </g>

    <g>
      <rect x="250" y="526" width="360" height="72" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
      <rect x="270" y="546" width="200" height="12" rx="6" fill="#0F172A" opacity="0.80"/>
      <rect x="270" y="568" width="240" height="10" rx="5" fill="#0F172A" opacity="0.25"/>
      <rect x="540" y="544" width="56" height="20" rx="10" fill="#E2E8F0"/>
      <text x="554" y="559" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#334155">Other</text>
    </g>

    <!-- Right panel: AI agent -->
    <g>
      <rect x="635" y="250" width="315" height="348" rx="22" fill="#0F172A" opacity="0.03"/>

      <rect x="660" y="275" width="265" height="64" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
      <text x="682" y="305" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" fill="#0F172A" opacity="0.90">
        Labeling AI Agent
      </text>
      <text x="682" y="327" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#0F172A" opacity="0.55">
        Reads intent " Assigns label " Prioritizes
      </text>

      <rect x="660" y="360" width="265" height="96" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
      <rect x="682" y="384" width="210" height="10" rx="5" fill="#0F172A" opacity="0.18"/>
      <rect x="682" y="404" width="236" height="10" rx="5" fill="#0F172A" opacity="0.18"/>
      <rect x="682" y="424" width="190" height="10" rx="5" fill="#0F172A" opacity="0.18"/>

      <rect x="660" y="476" width="265" height="122" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
      <text x="682" y="506" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#0F172A" opacity="0.55">
        Output labels
      </text>
      <g>
        <rect x="682" y="520" width="98" height="26" rx="13" fill="#FCE7F3"/>
        <text x="696" y="538" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#9D174D">Sponsorship</text>
      </g>
      <g>
        <rect x="786" y="520" width="108" height="26" rx="13" fill="#E0F2FE"/>
        <text x="802" y="538" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#075985">Collaboration</text>
      </g>
      <g>
        <rect x="682" y="552" width="132" height="26" rx="13" fill="#ECFCCB"/>
        <text x="696" y="570" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#3F6212">Business Inquiries</text>
      </g>
      <g>
        <rect x="820" y="552" width="60" height="26" rx="13" fill="#E2E8F0"/>
        <text x="836" y="570" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" fill="#334155">Others</text>
      </g>
    </g>

    <!-- Connector line (subtle) -->
    <path d="M615 420 C 640 420, 635 420, 660 420" stroke="#6366F1" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
    <circle cx="618" cy="420" r="5" fill="#6366F1" opacity="0.55"/>
    <circle cx="657" cy="420" r="5" fill="#6366F1" opacity="0.55"/>
  </g>

  <!-- Footer caption -->
  <text x="600" y="740" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" fill="#0F172A" opacity="0.55">
    Automatically triage email: faster responses, cleaner inbox
  </text>
</svg>
